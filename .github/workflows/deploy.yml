name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 35.154.164.127
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 300s
          script: |
            set -e
            cd /var/www/delhifilling
            git pull origin main
            npm install --production=false
            npm run build
            pm2 restart delhifilling || pm2 start ecosystem.config.js
            echo "✅ Deployed!"
